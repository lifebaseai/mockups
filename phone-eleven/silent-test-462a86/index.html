const $ = id => document.getElementById(id);
let ctx = null;
function samples(b64) {
  const s = atob(b64), bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return new Int16Array(bytes.buffer);
}
// As the demo page plays a call: a new sound player made in the tap, then the
// voice in tenth-of-a-second pieces, starting 1.5 seconds later, about when a
// demo call's first words arrive.
function play(b64, done) {
  try { if (ctx) ctx.close(); } catch {}
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  const s = samples(b64);
  let at = ctx.currentTime + 1.5;
  for (let i = 0; i < s.length; i += 1600) {
    const piece = s.subarray(i, i + 1600), out = ctx.createBuffer(1, piece.length, 16000), d = out.getChannelData(0);
    for (let j = 0; j < piece.length; j++) d[j] = piece[j] / 32768;
    const src = ctx.createBufferSource(); src.buffer = out; src.connect(ctx.destination); src.start(at); at += out.duration;
  }
  setTimeout(done, (at - ctx.currentTime) * 1000 + 600);
}
function busy(on) { $('one').disabled = on; $('two').disabled = on; }
$('one').addEventListener('click', () => {
  busy(true); $('said').textContent = 'Playing 1, the way pages play today...';
  play(ONE, () => { busy(false); $('said').textContent = '1 is done. Now tap 2.'; });
});
$('two').addEventListener('click', () => {
  busy(true);
  loud();
  const setting = navigator.audioSession ? 'yes' : 'no';
  $('said').textContent = 'Playing 2, with the fix...';
  setTimeout(() => {
    const backup = !IOS ? 'not needed here' : clip && !clip.paused ? 'playing' : 'did not start';
    $('said').textContent = (IOS ? '' : 'Not an iPhone or iPad, so the fix does nothing here. ') + "Safari's setting: " + setting + '. Backup clip: ' + backup + '.';
  }, 700);
  play(TWO, () => { plain(); busy(false); });
});
